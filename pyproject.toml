[project]
name = "FED3Tidy"
version = "0.1.0"
description = "A small library for easier parsing of FED3 data files"
readme = "README.md"
authors = [
    { name = "Ben Barnhart", email = "brbarnhart99@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "polars>=1.43.2",
]

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
